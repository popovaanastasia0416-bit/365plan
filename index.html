<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>365plan – printable planners for every day of the year</title>
<meta name="description" content="Printable PDF planners for money, home and habits.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--blue:#EAF5FD;--blue2:#E4F6FF;--line:#bfe3f7;--pink:#FCE3EE;--hl:#D6EFFC;--orange:#FF7242;--btn:#333}
*{box-sizing:border-box;margin:0;padding:0}
body{font-variant-numeric:lining-nums;font-family:'Cormorant',Georgia,serif;color:var(--ink);background-color:#fff;
  font-size:18px;line-height:1.55}
a{color:inherit}
.container{width:min(1160px,100% - 40px);margin:0 auto}

/* header */
.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ececec}
.header-in{width:min(1160px,100% - 40px);margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:70px}
.header-in .logo{justify-self:start}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;font-size:25px;font-weight:500;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.logo svg{width:28px;height:28px}
.nav{display:flex;gap:72px}
.nav a{text-decoration:none;font-size:19px;font-weight:500}
@media (max-width:900px){.nav a{font-size:16px}}
.nav a:hover{opacity:.6}

/* uptitle */
.uptitle{display:flex;justify-content:center;margin-top:0}
.uptitle div{background:var(--blue2);border:1px solid var(--line);font-size:16px;letter-spacing:2.5px;padding:15px 28px;margin-top:2px}
.wheel-wrap{display:flex;justify-content:center;margin-top:48px}
.wheel{width:min(540px,92vw);height:auto;animation:spin 60s linear infinite;filter:drop-shadow(0 14px 30px rgba(0,0,0,.12))}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.wheel{animation:none}}
.hero{text-align:center;margin:44px auto 0;max-width:760px}
.hero h1{font-size:30px;line-height:45px;font-weight:400}
.hero h1 span{background:var(--pink);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:2px 4px}
.mark{background:var(--hl);padding:0 2px}

/* benefits */
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:62px}
.ben{background:#EEF8FF;border-radius:16px;padding:28px 34px 34px;box-shadow:0 12px 24px -12px rgba(0,60,120,.18)}
.ben h3{display:flex;gap:12px;align-items:center;font-size:22px;font-weight:400;line-height:29.7px}
.ben h3 svg{width:20px;height:20px;flex:0 0 20px}
.ben p{font-size:18px;line-height:27.9px;margin:6px 0 0 32px}

.pill{display:flex;justify-content:center;margin:72px 0 46px}
.pill a{display:inline-block;background:var(--blue2);border:1px solid var(--line);border-radius:30px;padding:18px 48px;font-size:16px;text-decoration:none;
  box-shadow:0 10px 22px -12px rgba(0,60,120,.3)}

/* catalog */
.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--blue);border-radius:5px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card .img{height:372px;background:#fff;display:flex;justify-content:center;overflow:hidden;border-bottom:1px solid #e6eef4}
.card .img img{width:100%;height:100%;object-fit:cover;object-position:top}
.card .badge{position:absolute;right:16px;top:16px;width:50px;height:50px;border-radius:50%;background:var(--orange);color:#fff;
  font-family:Arial,sans-serif;font-size:11px;display:flex;align-items:center;justify-content:center;letter-spacing:.04em}
.card .body{padding:30px 30px 32px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:22px;font-weight:600;line-height:29.7px;margin-bottom:14px}
.card .descr{font-size:18px;line-height:1.15}
.card .descr p+p,.card .descr ol+p,.card .descr p+ol{margin-top:12px}
.card ol{padding-left:22px}
.card .actions{margin-top:auto;padding-top:28px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.more{background:#fff;color:#333;font-size:15px;font-weight:300;padding:5px 7px;text-decoration:none}
.buy{background:var(--btn);color:#fff;font-family:'Courier New',Courier,monospace;font-size:18px;font-weight:300;padding:5px 14px;text-decoration:none;border:0;cursor:pointer}
.buy:hover{background:#000}
.card.soon .img{background:linear-gradient(135deg,#f6f9fb,#eef3f6);align-items:center;font-size:26px;font-style:italic;color:#777}

.legal{text-align:center;font-size:14px;font-style:italic;margin:38px 0 0}

/* Q&A */
.qa{max-width:760px;margin:42px auto 80px}
.qa h2{text-align:center;font-size:18px;font-weight:600;margin-bottom:34px}
.qa h4{font-size:18px;font-weight:600;margin-top:30px}
.qa p{font-size:18px;line-height:27.9px}

footer{background:var(--blue);text-align:center;padding:24px 20px 26px;font-size:16px}
footer .links{display:flex;gap:46px;justify-content:center;margin-bottom:30px}
footer a{text-decoration:none}

dialog#look{margin:auto;border:0;padding:44px 24px 24px;max-width:min(1100px,96vw);background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog#look::backdrop{background:rgba(0,0,0,.45)}
dialog#look .pages{display:flex;gap:16px;overflow-x:auto}
dialog#look img{width:min(330px,78vw);flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.15)}
dialog#look .x{position:absolute;right:12px;top:6px;border:0;background:none;font-size:30px;cursor:pointer;line-height:1}
@media (max-width:900px){
  .header-in{height:60px;display:flex;justify-content:space-between;gap:14px}
  .nav{gap:20px}
  .benefits,.catalog{grid-template-columns:1fr}
  .hero h1{font-size:24px;line-height:36px}
  .uptitle div{font-size:14px;letter-spacing:1.5px;padding:12px 16px}
  .card .img{height:300px}
}

.articles{margin:70px 0 90px}
.articles h2{text-align:center;font-size:30px;font-weight:400;margin-bottom:30px}
.art-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.art{background:#fff;border:1px dashed #cfd8de;border-radius:8px;padding:16px 16px 22px;min-height:300px}
.art-img{height:170px;border-radius:5px;background:#f3f6f8;margin-bottom:16px}
.art-cat{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#8a9399}
.art h3{font-size:22px;font-weight:500;color:#9aa3a8;margin-top:4px}
@media (max-width:900px){.art-grid{grid-template-columns:1fr}}
.logo-ic{width:28px;height:28px}
.logo{gap:10px}
.logo-icon{height:34px;width:auto}
.logo-word{height:26px;width:auto}
@media (max-width:900px){.logo-icon{height:28px}.logo-word{height:20px}}
</style>
</head>
<body>

<header class="header"><div class="header-in">
  <a class="logo" href="index.html" aria-label="365plan home"><img class="logo-icon" src="img/logo-icon.png" alt=""><img class="logo-word" src="img/logo-word.png" alt="365plan"></a>
  <nav class="nav"><a href="planners.html#planners">Planners</a><a href="planners.html#qa">Q&amp;A</a><a href="planners.html#about">About</a></nav>
</div></header>

<div class="container">
  <div class="wheel-wrap"><img class="wheel" src="img/wheel.svg" alt="Wheel of life: health, career, finances, hobbies, personal growth, relationships, recreation, spirituality, family"></div>
  <section class="articles" id="articles">
    <h2>Articles</h2>
    <div class="art-grid"><article class="art"><div class="art-img"></div><p class="art-cat">Article</p><h3>Coming soon</h3></article><article class="art"><div class="art-img"></div><p class="art-cat">Article</p><h3>Coming soon</h3></article><article class="art"><div class="art-img"></div><p class="art-cat">Article</p><h3>Coming soon</h3></article></div>
  </section>
</div>
<footer>
  <div class="links"><a href="planners.html#planners">Planners</a><a href="planners.html#qa">Q&amp;A</a></div>
  <p>Support: <a href="mailto:YOUR-EMAIL@example.com">YOUR-EMAIL@example.com</a></p>
  <p>© <span id="y">2026</span> 365plan — printable planners for a calmer life.</p>
</footer>

<script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
